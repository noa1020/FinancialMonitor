apiVersion: apps/v1
kind: Deployment

metadata:
  name: financial-monitor-api

spec:

  replicas: 3

  selector:
    matchLabels:
      app: financial-monitor-api

  template:

    metadata:
      labels:
        app: financial-monitor-api

    spec:

      containers:

      - name: api

        image: financial-monitor-api:latest

        ports:

        - containerPort: 8080

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        env:

        - name: ASPNETCORE_ENVIRONMENT
          value: Production